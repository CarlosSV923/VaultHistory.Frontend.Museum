name: Quality

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, tests and build
    runs-on: ubuntu-latest
    env:
      USER_API_URL: http://user.test
      HISTORY_API_URL: http://history.test
      HISTORY_FRONTEND_TOKEN: ci-placeholder-not-a-secret
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:env
      - run: pnpm audit:dependencies
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
